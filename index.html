<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analytics &amp; AI Portfolio</title>
    <meta name="description" content="Data Analytics & AI Portfolio — turning complex data into clear, actionable insights.">
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="grid-background" aria-hidden="true"></div>
    
    <header id="hero" class="hero section">
        <!-- Rendered via JS -->
    </header>

    <main>
        <section id="projects-section" class="projects-section section">
            <div class="section-header">
                <h2>Projects</h2>
                <div class="filter-controls" role="group" aria-label="Project filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="data">Data</button>
                    <button class="filter-btn" data-filter="ai">AI</button>
                </div>
            </div>
            <div id="projects-grid" class="projects-grid">
                <!-- Project cards rendered via JS -->
            </div>
        </section>

        <section id="about-section" class="about-section section">
            <!-- Rendered via JS -->
        </section>
    </main>

    <footer id="footer" class="footer section">
        <!-- Rendered via JS -->
    </footer>

    <!-- Entry Point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
